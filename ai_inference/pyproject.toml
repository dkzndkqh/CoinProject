[project]
name = "ai-inference"
version = "0.1.0"
description = "Kronos/FinBERT GPU inference batch (uploads results to backend /api/internal)"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "httpx>=0.28.1",
    "huggingface-hub>=2.3.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.2",
    "safetensors>=0.8.0",
    "torch>=2.11.0",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
